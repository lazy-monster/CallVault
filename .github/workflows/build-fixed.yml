# Builds a release (non-debuggable) APK of this fork on every push to fix/phone-slowdown, or on demand.
#
# Signing: uses the SIGNING_KEYSTORE* secrets if the fork has them (so later builds update in place);
# otherwise generates a throwaway key for this run only. A throwaway-signed APK installs fine, but the
# next build will have a different key, so updating means uninstalling first.
name: Build fixed APK

on:
  push:
    branches: [ fix/phone-slowdown ]
  workflow_dispatch:

concurrency:
  group: build-fixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Unit tests for the changed code
        run: ./gradlew testDebugUnitTest --tests '*RewarmGateTest' --tests '*VoipGameGuardTest' --no-daemon --stacktrace

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release-keystore.jks
            { echo "KEYSTORE_PASSWORD=$KS_PASS"; echo "KEY_ALIAS=$KS_ALIAS"; echo "KEY_PASSWORD=$KEY_PASS"; } >> "$GITHUB_ENV"
            echo "Using the fork's own signing key."
          else
            PASS=$(openssl rand -hex 24)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore app/release-keystore.jks -alias release -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=CallVault fork build" -noprompt
            { echo "KEYSTORE_PASSWORD=$PASS"; echo "KEY_ALIAS=release"; echo "KEY_PASSWORD=$PASS"; } >> "$GITHUB_ENV"
            echo "No signing secrets set: using a throwaway key for this build."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
        run: ./gradlew assembleRelease -PversionName=2.5.1-fix -PversionCode=${{ github.run_number }} -PciBuildNumber=${{ github.run_id }} --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f app/release-keystore.jks

      - uses: actions/upload-artifact@v6
        with:
          name: CallVault-fixed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
